name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Smoke reproduction
        run: python scripts/reproduce.py smoke --output results/runs/ci-smoke
      - name: Upload run manifest
        uses: actions/upload-artifact@v4
        with:
          name: smoke-manifest
          path: results/runs/ci-smoke/manifest.json
