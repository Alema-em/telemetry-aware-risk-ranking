[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-aware-risk-ranking"
version = "0.1.0"
description = "Reproducibility package for telemetry-aware risk-sensitive intervention ranking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Alema Emran" }
]
dependencies = [
  "StepCountJITAI==0.0.1",
  "gymnasium==1.3.0",
  "lightgbm==4.6.0",
  "matplotlib==3.11.0",
  "numpy==1.26.4",
  "PyYAML==6.0.3",
  "scipy==1.11.4"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
